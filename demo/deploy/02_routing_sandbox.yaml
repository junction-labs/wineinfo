---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wineinfo-sommelier-sandbox-1
  labels:
    app: wineinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wineinfo
      service: sommelier-sandbox-1
  template:
    metadata:
      labels:
        app: wineinfo
        service: sommelier-sandbox-1
    spec:
      containers:
        - name: main
          image: wineinfo-python:latest
          imagePullPolicy: IfNotPresent
          command:
            [
              "fastapi",
              "run",
              "/app/sommelier_app.py",
              "--host",
              "0.0.0.0",
              "--port",
              "80",
            ]
          envFrom:
            - configMapRef:
                name: wineinfo-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
          env:
          - name: SANDBOX
            value: "sandbox-1"        
          - name: SOMMELIER_DEMO_EXPENSIVE
            value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: wineinfo-sommelier-sandbox-1
spec:
  type: ClusterIP
  selector:
    app: wineinfo
    service: sommelier-sandbox-1
  ports:
    - port: 80
---